<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart | Sameera Super</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
<nav class="navbar">
  <div class="logo">
    <img src="img.png" alt="Sameera Super Logo" class="logoimg">
    Sameera Super
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="inventory.html">Inventory</a></li>
    <li><a href="suppliers.html">Suppliers</a></li>
    <li><a href="orders.html">Orders</a></li>
    <li><a href="customers.html">Customers</a></li>
    <li><a href="cart.html">Cart</a></li>
    <li><a href="login.html">Profile</a></li>
  </ul>
</nav>

<main class="container">
  <h2>Your Shopping Cart</h2>

  <table class="inventory-table">
    <thead>
      <tr><th>Product</th><th>Quantity</th><th>Price</th><th>Total</th><th>Action</th></tr>
    </thead>
    <tbody>
      <tr>
        <td>Milk 1L</td>
        <td><input type="number" value="2" min="1" /></td>
        <td>350.00</td>
        <td>700.00</td>
        <td><button>Update</button><button>Remove</button></td>
      </tr>
      <tr>
        <td>Oil 1L</td>
        <td><input type="number" value="1" min="1" /></td>
        <td>650.00</td>
        <td>650.00</td>
        <td><button>Update</button><button>Remove</button></td>
      </tr>
      <tr>
        <td>Samba rice</td>
        <td><input type="number" value="10" min="1" /></td>
        <td>270.00</td>
        <td>2700.00</td>
        <td><button>Update</button><button>Remove</button></td>
      </tr>
    </tbody>
  </table>

  <button class="cta-button">Proceed to Checkout</button>
</main>

</body>
</html>
